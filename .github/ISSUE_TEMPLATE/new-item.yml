# Generated by `npm run sync:forms` from src/content/keywords.yaml — do not edit by hand.
name: New item
description: Add a project, paper, talk, performance… to the website
title: "[new] "
labels:
  - new-item
body:
  - type: markdown
    attributes:
      value: "Add something to the website. A link is often enough: the robot fills in the rest, places the item in the right rooms and places, and opens a pull request for you to check. Merge it and the site updates in about 2 minutes."
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - project
        - paper
        - preprint
        - talk
        - poster
        - performance
        - demo
        - media
        - teaching
        - dataset
        - software
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Main link
      description: A DOI (10.xxxx/…), a GitHub repository, a YouTube / Vimeo / SoundCloud / Spotify link, or any web page. Most fields are filled in from it.
  - type: input
    id: title
    attributes:
      label: Title
      description: Leave empty to use the title found from the link.
  - type: input
    id: date
    attributes:
      label: Date
      description: 2026, 2026-05 or 2026-05-14. Empty = from the link, or today.
  - type: textarea
    id: summary
    attributes:
      label: Summary (English)
      description: 1–3 sentences, shown on tiles and lists.
  - type: textarea
    id: summary_fr
    attributes:
      label: Summary (French, optional)
  - type: input
    id: event
    attributes:
      label: Event or venue
      description: 'For talks, posters, performances, media: e.g. "OHBM 2027". For papers: the journal (filled from the DOI).'
  - type: input
    id: location
    attributes:
      label: Location
      description: City, country — or "Online".
  - type: input
    id: project
    attributes:
      label: Part of project
      description: "Optional: the folder name of an existing project, e.g. cneuromod-mario. The item then appears on that project page."
  - type: checkboxes
    id: rooms
    attributes:
      label: Rooms
      description: Leave empty to choose automatically from the type.
      options:
        - label: research
        - label: code
        - label: art-music
  - type: checkboxes
    id: places
    attributes:
      label: Places
      description: Leave empty to let the robot suggest places from the text (the pull request will say which).
      options:
        - label: videogames — Videogames
        - label: neuroimaging — Neuroimaging
        - label: bci — Brain–computer interfaces
        - label: neuro-ai — Neuro-AI
        - label: music — Music
        - label: consciousness — Consciousness & flow
        - label: creativity — Art & creativity
  - type: textarea
    id: links
    attributes:
      label: Other links
      description: "One per line: `Label | https://…`"
  - type: textarea
    id: image
    attributes:
      label: Cover image
      description: "Projects only: drag and drop an image here."
  - type: checkboxes
    id: options
    attributes:
      label: Options
      options:
        - label: featured — show it bigger
        - label: publish directly — skip the pull request
