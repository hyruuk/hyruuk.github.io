# Clickable regions of the artwork ("places"), in world units (the artwork is 1210 x 900 units).
#
# Easiest way to edit: `npm run dev`, open http://localhost:4321/dev/regions/, click on the art to
# draw, then copy the generated YAML here.
#
# Each key is a keyword id from src/content/keywords.yaml:
#   polygons: one or more lists of x,y pairs (a place can own several separate areas)
#   label:    where the floating label/marker sits (x, y)
#   camera:   the rectangle the camera flies to on the place page (see world.yaml for options)

videogames:
  polygons:
    - [0,112, 130,100, 250,135, 345,185, 352,330, 365,420, 345,500, 420,540, 455,640, 440,760, 390,850, 0,862]
  label: [175, 455]
  camera: { rect: [0, 110, 460, 750], fit: cover, align: [0.35, 0.5], portrait: { rect: [40, 120, 380, 700] } }

